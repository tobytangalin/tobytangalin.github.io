baseURL = "https://sitegrammar.com/"
locale = "en-US"
defaultContentLanguage = "en"
title = "Site Grammar"
theme = "PaperMod"

# PaperMod handles favicon/robots; Hugo generates robots.txt from this flag.
enableRobotsTXT = true

# GA4 (was MonsterInsights G-DS881CXGTX).
googleAnalytics = "G-DS881CXGTX"

# Avoid generating an unused /categories/ term-list page; terms still build.
disableKinds = ["taxonomy"]

# Respect the browser Do Not Track signal for GA4.
[privacy]
  [privacy.googleAnalytics]
    respectDoNotTrack = true

[pagination]
  pagerSize = 10

# Legacy WordPress URL shapes.
[permalinks]
  blog = "/:slug/"
  categories = "/category/:slug/"

[taxonomies]
  category = "categories"

[markup]
  [markup.goldmark]
    # Post bodies are migrated from WordPress HTML; allow raw HTML blocks.
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false

# Emit RSS at the legacy WordPress /feed/ directory URLs via scripts/relocate-feeds.sh
# (Hugo's output-format `path` is global, so it cannot produce /<slug>/feed/index.xml).
[outputs]
  home = ["HTML", "RSS", "JSON"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML", "RSS"]
  term = ["HTML", "RSS"]
  page = ["HTML", "RSS"]

[params]
  # No `env = "production"` override. PaperMod/Hugo emit GA4, OpenGraph, Twitter
  # and JSON-LD only when hugo.IsProduction. `hugo server` runs in "development",
  # so local previews no longer send hits to the live GA property, while `hugo`
  # and CI builds (production) still do.
  mainSections = ["blog"]
  comments = true
  description = "Site Grammar"
  author = "Christopher Tangalin"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  ShowCodeCopyButtons = true
  ShowBreadCrumbs = true
  ShowPostNavLinks = true
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true

  [params.assets]
    disableFingerprinting = true
    # Reuse the old WordPress site icon; PaperMod hard-codes these default names.
    favicon = "/wp-content/uploads/2020/01/toby_streams-150x150.jpg"
    favicon16x16 = "/wp-content/uploads/2020/01/toby_streams-150x150.jpg"
    favicon32x32 = "/wp-content/uploads/2020/01/toby_streams-150x150.jpg"
    apple_touch_icon = "/wp-content/uploads/2020/01/toby_streams.jpg"
    safari_pinned_tab = "/wp-content/uploads/2020/01/toby_streams.jpg"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/christophertangalin/"

  # Client-side search relevance. Keys are lowercase because Hugo lowercases
  # config keys and PaperMod reads params.fuseOpts.<name> in lowercase.
  # threshold 0.15 = precise substring matching over title+summary; body text
  # is intentionally not indexed or searched.
  [params.fuseOpts]
    threshold = 0.15
    ignorelocation = true
    keys = ["title", "summary"]
    minmatchcharlength = 3

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 10
[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 20
[[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 25
[[menu.main]]
  name = "Site Grammar"
  url = "/"
  weight = 30
